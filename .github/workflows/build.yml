name: Build WinRing.exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install PySide6 pyinstaller
      - name: Build
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter winring.pyw | Select-Object -First 1
          if (-not $f) {
            Get-ChildItem -Recurse -Name | Select-Object -First 60
            throw "winring.pyw tidak ditemukan di repositori"
          }
          Set-Location $f.DirectoryName
          python -m PyInstaller --noconsole --onefile --name WinRing winring.pyw
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\out" | Out-Null
          Copy-Item dist\WinRing.exe "$env:GITHUB_WORKSPACE\out\"
      - uses: actions/upload-artifact@v4
        with: { name: WinRing, path: out/WinRing.exe }
