name: Build WinRing.exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install PySide6 pyinstaller
      - run: python -m PyInstaller --noconsole --onefile --name WinRing winring.pyw
      - uses: actions/upload-artifact@v4
        with: { name: WinRing, path: dist/WinRing.exe }
